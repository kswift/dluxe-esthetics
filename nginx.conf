# Local preview config for DLo Esthetics static site.
# GitHub Pages does NOT run nginx in production — this file is only for
# previewing the site locally the same way it will look when deployed.
#
# Usage (from the project root):
#   nginx -p . -c nginx.conf
# Then visit http://localhost:8080
#
# Stop with: nginx -p . -s stop -c nginx.conf

worker_processes  1;
error_log         logs/error.log warn;
pid               logs/nginx.pid;

events {
  worker_connections  1024;
}

http {
  # Inlined instead of "include mime.types;" so this config works with any
  # nginx install without depending on where its bundled mime.types lives.
  types {
    text/html                 html htm;
    text/css                  css;
    application/javascript    js;
    image/svg+xml              svg svgz;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/gif                 gif;
    image/x-icon               ico;
    application/json          json;
    font/woff                 woff;
    font/woff2                woff2;
  }
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen       8080;
    server_name  localhost;
    root         .;
    index        index.html;

    # Mimic GitHub Pages' 404 behavior
    error_page 404 /404.html;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
